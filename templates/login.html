<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - AI Learning Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .input-group {
            position: relative;
            margin-bottom: 20px;
            display: block;
            text-align: left;
        }
        .input-group > i.fa-user,
        .input-group > i.fa-lock {
            position: absolute;
            top: 50%;
            left: 14px;
            right: auto;
            transform: translateY(-50%);
            color: #888;
            pointer-events: none;
            z-index: 5;
            font-size: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 44px 12px 38px !important;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
            outline: none;
        }
        .input-group input:focus {
            border-color: maroon;
            box-shadow: 0 0 0 3px rgba(128, 0, 0, 0.1);
        }
        .input-group .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px !important;
            left: auto !important;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
            z-index: 10;
            padding: 4px;
            font-size: 15px;
        }
        .input-group .toggle-password:hover {
            color: maroon;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-user-graduate logo-icon"></i>
            <h2>Welcome Back</h2>
            <p class="login-subtext">Login to your account</p>
        </div>

        {% if message %}
            <p class="login-error">{{ message }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" id="username" required placeholder="Username" autofocus>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password" required placeholder="Password">
                <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility()" title="Show/Hide Password"></i>
            </div>

            <div class="form-options">
                <label><input type="checkbox" name="remember" checked> Remember me</label>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="login-footer">
            <p><a href="{{ forgot_password_url }}">Forgot password?</a></p>
            <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById("password");
            const icon = document.querySelector(".toggle-password");
            if (pwd.type === "password") {
                pwd.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                pwd.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        // Prevent showing cached login page when using browser back button
        window.addEventListener('pageshow', function (event) {
            if (event.persisted || (window.performance && window.performance.getEntriesByType("navigation")[0]?.type === "back_forward")) {
                window.location.reload();
            }
        });

        // If user is already authenticated in session, immediately replace URL with dashboard
        {% if session.get('loggedin') %}
        window.location.replace("{{ url_for('user_dashboard') }}");
        {% endif %}
    </script>
</body>
</html>
